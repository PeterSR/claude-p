# GoReleaser config for claude-p.
#
# Triggered by pushing a tag (e.g. v0.1.0) — see .github/workflows/release.yml.

version: 2

before:
  hooks:
    - go mod tidy

builds:
  - id: claude-p
    main: ./cmd/claude-p
    binary: claude-p
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w
      - -X main.version={{ .Version }}
      - -X main.commit={{ .Commit }}
      - -X main.date={{ .Date }}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - id: claude-p
    ids:
      - claude-p
    name_template: >-
      {{ .ProjectName }}_
      {{- .Version }}_
      {{- .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    files:
      - README.md
      - LICENSE

# Multi-arch image on ghcr.io. The freshly built linux binaries are placed in
# the build context (linux/<arch>/claude-p), because the draft release's assets
# are not downloadable while this runs. pupptyeer comes from its
# published image and Claude Code is fetched inside the Dockerfile, both at the
# versions pinned there (build args).
dockers_v2:
  - id: claude-p
    ids:
      - claude-p
    images:
      - ghcr.io/petersr/claude-p
    tags:
      - "{{ .Version }}"
      - latest
    platforms:
      - linux/amd64
      - linux/arm64
    dockerfile: docker/Dockerfile
    extra_files:
      - docker/entrypoint.sh
    build_args:
      CLAUDE_P_VERSION: "{{ .Version }}"
      REVISION: "{{ .FullCommit }}"

checksum:
  name_template: 'checksums.txt'

snapshot:
  version_template: '{{ incpatch .Version }}-snapshot'

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^chore:'
      - '^ci:'
      - 'Merge pull request'
      - 'Merge branch'

release:
  github:
    owner: PeterSR
    name: claude-p
  draft: true
  prerelease: auto
