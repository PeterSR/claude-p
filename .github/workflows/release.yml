name: Release

on:
  push:
    tags:
      - 'v*.*.*'

# Each job gets only what it needs (see the job-level blocks).
permissions: {}

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub release
      packages: write # push the image to ghcr.io
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      # Multi-arch image build (dockers_v2 uses buildx).
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: goreleaser/goreleaser-action@v6
        with:
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Publish @petersr/claude-p (+ the 6 platform packages) to npm. Gated behind
  # the PUBLISH_NPM repo variable so the workflow is safe to land before the
  # packages exist on npm (their first publish is manual — see PUBLISHING.md).
  publish-npm:
    if: vars.PUBLISH_NPM == '1'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm OIDC trusted publishing
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      # npm >= 11.5 is required for OIDC trusted publishing. Pinned to the 11
      # line rather than latest, whose node floor moves on its own (npm 12.2
      # needs node >= 22.22.2) and would break a release with no change here.
      - run: npm install -g npm@11

      - name: Build per-platform packages
        run: node npm/build.mjs "${GITHUB_REF_NAME#v}"

      - name: Publish platform packages, then the meta package
        run: |
          set -e
          for d in npm/claude-p-*/; do
            ( cd "$d" && npm publish --access public --provenance )
          done
          ( cd npm/claude-p && npm publish --access public --provenance )
